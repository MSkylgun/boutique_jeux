
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boutique Echecs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>♟ Boutique d'échecs</h1>

    <h2>Vos points : <span id="points">500</span> 💰</h2>

    <div class="boutique">

        <div class="item">
            <h2>Skin 1</h2>
            <p>Description du skin</p>
            <p>Prix : 100 points</p>
            <button onclick="acheter(100, 'Skin 1')">
                Acheter
            </button>
        </div>

        <div class="item">
            <h2>Skin 2</h2>
            <p>Description du skin</p>
            <p>Prix : 200 points</p>
            <button onclick="acheter(200, 'Skin 2')">
                Acheter
            </button>
        </div>

        <div class="item">
            <h2>Skin 3</h2>
            <p>Description du skin</p>
            <p>Prix : 300 points</p>
            <button onclick="acheter(300, 'Skin 3')">
                Acheter
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
